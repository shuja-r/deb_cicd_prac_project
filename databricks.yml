# This is a Declarative Automation Bundle definition for deb_cicd_prac_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: deb_cicd_prac_project
  uuid: 2c5e560d-eae6-4565-81ef-30320f016a21

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
    default: 'citibike_dev'
  # schema:
  #   description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405610107372144.4.azuredatabricks.net
    # variables:
    #   catalog: dbw_etl_dev_sindia
    #   schema: dev
    presets:
      artifacts_dynamic_version: true
  test:
    mode: production
    presets:
      name_prefix: '[testing]'
    workspace:
      host: https://adb-7405606728212940.0.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/shujarahamani@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: 'citibike_test'
    #   schema: prod
    permissions:
      - user_name: shujarahamani@gmail.com
        level: CAN_MANAGE
  prod:
    mode: production
    workspace:
      host: https://adb-7405608929816991.11.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/shujarahamani@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: 'citibike_prod'
    #   schema: prod
    permissions:
      - user_name: shujarahamani@gmail.com
        level: CAN_MANAGE
